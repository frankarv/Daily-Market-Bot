name: Daily Market Intelligence

permissions:
  contents: write

on:
  workflow_dispatch: {}

jobs:
  market-intel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Test Market Analysis Agent
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-4-6"
          PYTHONPATH: ${{ github.workspace }}
        run: python -c "from bot.agents.market_agent import run_market_agent; print('Running agent test...'); report = run_market_agent(); print('Agent output:'); print(report)"

      - name: Run Market Intelligence Agent
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-4-6"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PYTHONPATH: ${{ github.workspace }}
        run: python bot/main.py

      - name: Debug files
        run: ls -al

      - name: Commit market report
        if: always()
        run: |
          if [ -f market-report.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add market-report.md
            git commit -m "Daily market report" || echo "No changes to commit"
            git push || echo "No push (no changes or insufficient permissions)"
          else
            echo "market-report.md not found — skipping commit"
          fi
