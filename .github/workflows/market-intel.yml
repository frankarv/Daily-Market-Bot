name: Daily Market Intelligence

permissions:
  contents: write

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC ≈ 6:00 AM MST (Mon–Fri)
  workflow_dispatch: {}

jobs:
  market-intel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r bot/requirements.txt

      # Optional but HIGHLY recommended during development
      - name: Test Market Analysis Agent
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-4-6"
        run: |
          source .venv/bin/activate
          python - << 'EOF'
from bot.agents.market_agent import run_market_agent
print("Running agent test...")
report = run_market_agent()
print("Agent output:")
print(report)
EOF

      - name: Run Market Intelligence Agent
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          CLAUDE_MODEL: "claude-sonnet-4-6"
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          source .venv/bin/activate
          python bot/main.py

      - name: Debug files
        run: ls -al


      - name: Commit market report
        if: always()
        run: |
          if [ -f market-report.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add market-report.md
            git commit -m "Daily market report" || echo "No changes to commit"
            git push || echo "No push (no changes or insufficient permissions)"
          else
            echo "market-report.md not found — skipping commit"
          fi
